name: Supervisor orchestration tests

on:
  push:
    branches:
      - feat/claude-style-tools
  pull_request:
    paths:
      - 'local_coder/supervisor.py'
      - 'local_coder/engine.py'
      - 'local_coder/store.py'
      - 'local_coder/cli.py'
      - 'local_coder/report.py'
      - 'tests/test_supervisor.py'
      - '.github/workflows/supervisor-tests.yml'

permissions:
  contents: read

jobs:
  supervisor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax check
        run: |
          python -m py_compile             local_coder/supervisor.py             local_coder/engine.py             local_coder/store.py             local_coder/cli.py             local_coder/report.py
      - name: Supervisor unit tests
        run: python -m unittest tests.test_supervisor -v
